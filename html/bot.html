<div class="chat-toggle-btn" id="chatToggle" title="Open Studio Assistant">
    <span class="chat-accessible-text">Open Chat</span>
</div>
<div class="chat-window" id="chatWindow">
    <div class="chat-header">
        <h6>Hour Concierge</h6>
        <span class="close-chat" id="chatClose">&times;</span>
    </div>
    <div class="chat-body" id="chatBody">
        <div class="chat-msg bot-msg">Welcome to Golden Hour Hair. How can I assist with your beauty package selections today?</div>
        <div class="suggested-prompts-tray">
            <span class="prompt-chip" data-query="Where are you located?">📍 Studio Location</span>
            <span class="prompt-chip" data-query="How much is a blowout?">💇 Blowout Pricing</span>
            <span class="prompt-chip" data-query="What are your bridal rates?">🥂 Bridal Trials</span>
            <span class="prompt-chip" data-query="How do I book an appointment?">📅 Book Now</span>
        </div>
    </div>
    <div class="chat-footer">
        <input type="text" placeholder="Ask anything..." id="chatInput">
        <button id="chatSend">Send</button>
    </div>
</div>
